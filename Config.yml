
DATA_CONTENT:
  BOLD_And_Behavioral:
    Diagnoses: 
      Diags: CTRL, MCI
      Dg1: CN, MCI, AD
      Dg2: RM
    Demography:
      DMG_Age:
      DMG_Sex: F, M
      DMG_EduYears:
    Activation:
      Domain: Space, Time, SpaceTime
      SignalType: Default, Beta, PSC, Z
      Region: Rsp, Hpc, pCunPCC
      Size: Sum, Max_25, Max_50, Max_100, Max_200
      Format: "{Domain}_{SignalType}_{Region}_{Size}"
    OrientationPerformance:
      Domain: Lex, Space, Time, Person
      Subtype: D1, D2
      Format: "EC_{Domain}[_{Subtype}]"
    Connectivity:
      ParcelType: Singles, Bilaterals, Networks
      Format: "RSP_TO_{ParcelType}[_{Hemi}]_{Network}[_{Region}]"
      Example: RSP_TO_Singles_LH_ContA_IPS
    NeuroPsy:
      Tests: Bonson, Flow, Frontal, Keshev, Lang, Memory
    HippocampusVol:
      Measures: CFT, CFT2, CFT2_MNI, CFT_MNI, FS
      Hemis: L, R
      Format: "HPVOL_{Measures}_{Hemi}"
      
DATA_SOURCES:
  BOLD_And_Behavioral: dfSbjData.pkl
  Null_Models_OrientationPerformance: 
    All: "NullModel.pkl"
    CN_Only: "NullModelCN.pkl"

