DEFAULT_CFG:
  Activation: 
    Domains: Mental_VS_Lex
    SignalType: Default
    Region: Hpc
    Size: Max_200
  OrientationPerformance:
    Domain: Lex
    Subtype: 
    Null_Model: All
  Connectivity:
    ParcelType: Singles
  HippocampusVol:
